<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ProjectOps</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

  <header class="app-header">
    <h1>📊 ProjectOps</h1>
    <input type="text" id="searchInput" placeholder="Search tasks or projects..." />
  </header>

  <main class="app-container">
    <aside class="sidebar">
      <button id="newProjectBtn">+ New Project</button>
      <ul id="projectList"></ul>
    </aside>

    <section class="content">
      <div id="dashboard"></div>

      <div id="projectView" class="hidden">
        <h2 id="projectTitle"></h2>

        <div class="task-controls">
          <input id="taskName" placeholder="Task name" />
          <select id="taskPriority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
          <input type="date" id="taskDeadline" />
          <button id="addTaskBtn">Add Task</button>
        </div>

        <div class="task-columns">
          <div class="column" data-status="todo">
            <h3>Todo</h3>
            <ul></ul>
          </div>
          <div class="column" data-status="progress">
            <h3>In Progress</h3>
            <ul></ul>
          </div>
          <div class="column" data-status="done">
            <h3>Done</h3>
            <ul></ul>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
